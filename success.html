<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TEMPLE3 · הזמנה התקבלה</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;900&family=Heebo:wght@300;400;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Heebo', sans-serif;
      background: #0a0a0a;
      color: #e0dbd0;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      direction: rtl;
    }
    .card {
      background: #111;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 3rem 2.5rem;
      text-align: center;
      max-width: 420px;
      width: 90%;
    }
    .seal {
      font-family: 'Cinzel', serif;
      font-size: 2.5rem;
      color: #d4a843;
      letter-spacing: 4px;
      margin-bottom: 0.25rem;
    }
    .seal-sub {
      font-size: 0.6rem;
      letter-spacing: 5px;
      color: #555;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }
    .check {
      width: 64px; height: 64px;
      background: rgba(39,174,96,0.12);
      border: 2px solid rgba(39,174,96,0.4);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.5rem;
      font-size: 1.8rem;
    }
    h1 { font-family: 'Cinzel', serif; font-size: 1.3rem; letter-spacing: 2px; margin-bottom: 0.75rem; color: #e0dbd0; }
    p { font-size: 0.88rem; color: #888; line-height: 1.7; margin-bottom: 1.5rem; }
    .order-id { font-size: 0.72rem; color: #555; direction: ltr; }
    a {
      display: inline-block;
      margin-top: 1rem;
      background: #d4a843;
      color: #000;
      text-decoration: none;
      padding: 0.65rem 1.5rem;
      border-radius: 6px;
      font-family: 'Cinzel', serif;
      font-size: 0.8rem;
      letter-spacing: 1.5px;
      font-weight: 700;
    }
    a:hover { opacity: 0.88; }
  </style>
</head>
<body>
  <div class="card">
    <div class="seal">TEMPLE3</div>
    <div class="seal-sub">SACRED STREETWEAR</div>
    <div class="check">✓</div>
    <h1>ההזמנה התקבלה!</h1>
    <p>תודה על רכישתך. הזמנתך נשלחה לעיבוד ותישלח בקרוב.<br/>תקבל עדכון במייל כאשר החבילה תצא לדרך.</p>
    <p class="order-id" id="orderId"></p>
    <a href="/">חזרה לחנות</a>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const pi     = params.get('payment_intent');
    if (pi) {
      document.getElementById('orderId').textContent = `מזהה הזמנה: ${pi}`;
    }
  </script>
</body>
</html>
